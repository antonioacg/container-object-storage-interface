# Fork-only workflow (antonioacg/container-object-storage-interface): build and
# push the patched controller image to ghcr for the ops platform's `cosi`
# Kustomization image override. Not intended for upstream — delete from any
# upstream PR branch.
name: Fork controller image

on:
  push:
    branches:
      - fix/waiting-requeue-not-backoff-b7d3b7d
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push controller image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: controller/Dockerfile
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ghcr.io/antonioacg/objectstorage-controller:v0.2.0-rc1-b7d3b7d-fix.1
